; ─────────────────────────────────────────────────────────────────────
; 클래스 이름 변경 리다이렉트 (2026-08-25)
;
; UChatSubsystem -> UServerSubsystem 으로 바꿨다. 이 프로세스는 채팅뿐 아니라
; 로그인 · 방 · 친구 · 메신저를 전부 다루므로 "Chat" 이 이름에서 거짓말이었다.
; (폴더를 Chat/ 에서 Server/ 로 옮긴 2026-08-24 개편과 같은 이유다)
;
; 저장소의 .uasset 중 이 클래스를 참조하는 것은 없었지만, 팀원 PC 에 아직
; 커밋되지 않은 블루프린트가 있을 수 있어 안전망으로 남긴다.
; 모두가 한 번씩 열어 재저장한 뒤에는 지워도 된다.
; ─────────────────────────────────────────────────────────────────────
[CoreRedirects]
+ClassRedirects=(OldName="/Script/TeamProject_MOU.ChatSubsystem",NewName="/Script/TeamProject_MOU.ServerSubsystem")

; ---------------------------------------------------------------------------
; 넷드라이버 - UDP 홀펀칭을 위해 클라이언트 바인드 포트를 고정한다. (v10)
;
; [왜 기본 드라이버를 안 쓰는가]
;   UIpNetDriver::GetClientPort() 는 0 을 돌려주고, 그러면 클라이언트가 임시 포트로
;   붙는다(로그의 "Created socket for bind address: 0.0.0.0:0").
;   참여자 쪽 공유기가 port-restricted cone 이라 방장은 참여자의 **정확한 포트**로
;   미리 punch 해야 하는데, 임시 포트는 그 번호를 미리 알 수 없다.
;
;   UMOUIpNetDriver 는 GetClientPort() 하나만 갈아끼운다. 나머지 동작은 엔진 그대로다.
;   UServerSubsystem 이 확보한 포트를 못 넘겨준 경우에는 0 을 돌려주므로,
;   그때는 예전과 똑같이 임시 포트로 붙는다 — 홀펀칭만 안 되고 접속은 된다.
;
; ★ 이 줄을 지우면 홀펀칭이 조용히 동작하지 않는다. 접속 실패로 보이지 않고
;   "외부 참여자만 못 들어오는" 예전 증상으로 돌아간다.
; ---------------------------------------------------------------------------
; ★ 섹션이 [/Script/Engine.Engine] 이어야 한다. GameEngine 이 아니다.
;
;   엔진의 BaseEngine.ini 는 NetDriverDefinitions 를 **기반 클래스 섹션**인
;   [/Script/Engine.Engine] 에 선언한다. 거기에 써야 게임(UGameEngine)과
;   에디터(UEditorEngine) 양쪽에 적용된다.
;
;   처음에 [/Script/Engine.GameEngine] 에 넣었더니 **PIE 에서만 안 먹었다** —
;   에디터는 자기 클래스 섹션을 보므로 기본 드라이버가 그대로 쓰였고,
;   로그에 "Created socket for bind address: 0.0.0.0:0" 이 찍히며 클라이언트가
;   임시 포트로 붙었다. 그 상태로는 홀펀칭이 원리적으로 불가능하다.
[/Script/Engine.Engine]
