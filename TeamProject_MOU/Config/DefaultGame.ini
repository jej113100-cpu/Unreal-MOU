; ---------------------------------------------------------------------------
; MOU 채팅/로그인 서버 주소  (C++: UMOUServerSettings, Server/ServerSettings.h)
;
; 서버(MOU_Server/Server_Build/Server.exe)는 팀에서 한 대의 PC 에서만 돌린다.
; 이 파일은 git 으로 공유되므로, 여기 한 줄만 맞으면 팀 전원이 같은 서버를 본다.
;
; ★ 지금 값은 서버 PC 의 LAN IP 가 아니라 **공인 IP** 다. (2026-08-26 변경)
;   팀원이 서버와 다른 공유기 밑에 있게 되면서, 사설 IP(192.168.x.x)로는
;   아예 도달할 수 없게 됐기 때문이다. 사설 IP 는 그 공유기 안에서만 통한다.
;
;   공인 IP 를 쓰려면 서버 PC 쪽 공유기에 포트포워딩이 되어 있어야 한다:
;     외부 TCP 9000  ->  서버 PC 의 LAN IP:9000
;   (UPnP 가 켜진 공유기라면 Server.exe 에 --upnp 를 주면 자동으로 열린다.
;    안 열리면 [NAT] 로그에 사유가 찍히므로 그때 수동으로 넣는다.)
;
; ★ 절대 127.0.0.1 / localhost 로 되돌리지 말 것.
;   127.0.0.1 은 "이 게임이 돌고 있는 그 PC" 라는 뜻이라, 서버를 켜지 않은 팀원은
;   자기 자신에게 접속을 시도하다 무조건 실패한다.
;
; ★ 서버를 켠 PC 본인은 이 주소로 못 붙을 수 있다.
;   공유기가 "자기 공인 IP 로 나갔다가 자기한테 되돌아오는" 접속(NAT 헤어핀)을
;   지원하지 않는 경우가 흔하다. 그럴 때는 이 파일을 고치지 말고 그 PC 에서만
;   콘솔로  MOU.Chat.SetServer 127.0.0.1 9000  을 쓴다 (Saved/ 에만 저장돼서
;   git 에 안 올라간다). 되돌리려면 인자 없이  MOU.Chat.SetServer.
;
; ★ 공인 IP 는 가정용 회선에서 바뀔 수 있다(공유기 재부팅, ISP 재할당).
;   접속이 갑자기 안 되면 서버 PC 에서 공인 IP 를 다시 확인하고 이 줄을 고쳐 커밋한다.
;
; 개인 PC 에서만 잠깐 다른 주소를 보고 싶으면 이 파일을 고치지 말고
;   - 실행 인자:  -MOUServer=1.2.3.4:9000
;   - 콘솔 명령:  MOU.Chat.SetServer 1.2.3.4 9000   (이 PC 에만 저장됨)
; 를 쓴다. 현재 적용된 주소는 콘솔에서 MOU.Chat.Server 로 확인한다.
; ---------------------------------------------------------------------------
[/Script/TeamProject_MOU.MOUServerSettings]
ServerHost=211.244.139.254
ServerPort=9000

; 계정 인증 + 세션 탐색(방 목록)을 무엇으로 할 것인가.
;   CustomSocket  자체 서버(MOU_Server/Server.exe). 개발/LAN 시연용. 지금은 이것.
;   EOS           Epic Online Services. NAT 통과가 필요한 외부 접속용. 아직 뼈대만 있다.
;
; ★ 어느 쪽을 골라도 이동/전투/GAS 는 호스트의 리슨서버가 처리한다.
;   여기서 정하는 것은 "방이 열리기 전" 과 "계정" 뿐이고, 게임 트래픽은 지나가지 않는다.
;
; 개인 PC 에서만 잠깐 바꾸려면 실행 인자를 쓴다:  -MOULobbyBackend=EOS
LobbyBackend=CustomSocket

; 게임 시작 후 방장의 리슨서버가 열리기를 기다리는 최대 시간(초).
; 이 시간 안에 열리면 그 즉시 참여자가 출발한다 — 이 값은 상한일 뿐 대기 시간이 아니다.
; 넘기면 출발 신호를 보내지 않고 참여자는 대기실에 남는다(죽은 주소로 보내지 않기 위해서).
HostReadyTimeoutSeconds=60.0

; 방을 만들 때 공유기에 UPnP 로 포트를 열어달라고 시도할지. (2026-08-28)
;
; ★ True 다. 끄지 말 것.
;   방장이 되려면 그 PC 가 있는 네트워크의 공유기에
;     외부 UDP 7777 -> 방장 PC 의 LAN IP : 7777
;   이 열려 있어야 하는데, 팀원 전원이 자기 공유기에 이걸 손으로 넣기는 어렵다.
;   UPnP 는 그 일을 게임이 대신 해주는 수단이고, 실제로 이것 덕분에 다른
;   네트워크의 팀원이 방장을 할 수 있었다.
;
;   한 번 False 로 바꿨다가(수동 포워딩으로 간다고 판단) 다른 네트워크 방장의
;   7777 이 아무도 열어주지 않는 상태가 되어 참여자가 전부 못 들어왔다.
;   수동 포워딩은 UPnP 의 **대안이 아니라 보완**이다 — 서버 PC 처럼 고정된
;   한 대는 수동으로 넣어두고, 나머지는 UPnP 에 맡긴다.
;
; ★ 로그인 서버(9000) 쪽 공유기 포워딩과 헷갈리지 말 것.
;   게임 트래픽은 서버를 거치지 않고 참여자가 방장에게 직접 붙는다.
;   그래서 여는 공유기가 서로 다르다 — SERVER_INTEGRATION.md 13절 표 참고.
;
; UPnP 가 안 되는 공유기(또는 CGNAT)라면 그 사람은 방장을 할 수 없다.
; 그때는 그 PC 의 공유기에 7777/UDP 를 수동으로 넣어주면 된다.
;
; 이번 실행만 꺼보려면 실행 인자로:  -MOUUseUpnp=0
; 지금 이 공유기가 UPnP 를 지원하는지 확인하려면 콘솔에서:  MOU.Nat.Open 7777
bUseUpnpPortMapping=True
