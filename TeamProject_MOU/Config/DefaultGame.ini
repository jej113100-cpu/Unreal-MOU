; ---------------------------------------------------------------------------
; MOU 채팅/로그인 서버 주소  (C++: UMOUServerSettings, Chat/ServerSettings.h)
;
; 서버(MOU_Server)는 팀에서 한 대의 PC 에서만 돌린다.
; 이 파일은 git 으로 공유되므로, 여기 한 줄만 맞으면 팀 전원이 같은 서버를 본다.
;
; ★ 절대 127.0.0.1 / localhost 로 되돌리지 말 것.
;   127.0.0.1 은 "이 게임이 돌고 있는 그 PC" 라는 뜻이라, 서버를 켜지 않은 팀원은
;   자기 자신에게 접속을 시도하다 무조건 실패한다.
;   서버 PC 의 LAN IP 를 적으면 서버를 켠 사람도 자기 자신에게 잘 붙으므로,
;   서버를 켠 사람과 아닌 사람이 같은 설정을 그대로 쓸 수 있다.
;
; 서버 PC 의 IP 가 바뀌면(공유기 재부팅 등) 이 줄만 고쳐서 커밋한다.
; 개인 PC 에서만 잠깐 다른 주소를 보고 싶으면 이 파일을 고치지 말고
;   - 실행 인자:  -MOUServer=192.168.0.99:9000
;   - 콘솔 명령:  MOU.Chat.SetServer 192.168.0.99 9000   (이 PC 에만 저장됨)
; 를 쓴다. 현재 적용된 주소는 콘솔에서 MOU.Chat.Server 로 확인한다.
; ---------------------------------------------------------------------------
[/Script/TeamProject_MOU.MOUServerSettings]
ServerHost=192.168.0.32
